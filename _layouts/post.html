---
layout: default
---

<article class="single-post">
  <header class="post-header">
    <time class="post-date">{{ page.date | date: "%d/%m/%Y" }}</time>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <div class="post-body">
    {{ content }}
  </div>

  <div class="post-navigation">
    <a href="{{ '/' | relative_url }}">&larr; Voltar para a página inicial</a>
  </div>
</article>
