---
layout: default
---

<article class="post-single">
  <header class="post-header">
    <time class="post-meta">{{ page.date | date: "%d de %b de %Y" }}</time>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <div class="post-back">
    <a href="{{ '/' | relative_url }}">&larr; Voltar para as notas</a>
  </div>
</article>
