---
layout: default
---

<article class="post-single">
  <header class="post-header">
    <div class="post-meta">
      <time>{{ page.date | date: "%d de %b de %Y" }}</time>
      <span class="meta-sep">·</span>
      <span class="post-author">{{ page.author | default: site.author }}</span>
      <span class="meta-sep">·</span>
      <span class="post-views">👁️ <span id="page-views">...</span> leituras</span>
    </div>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <!-- Botões de compartilhamento ... -->

  <div class="post-back">
    <a href="{{ '/' | relative_url }}">&larr; Voltar para as notas</a>
  </div>
</article>

<!-- Script do Contador de Visitas -->
<script>
  (function() {
    const namespace = "makinadeideias-blog";
    // Cria uma chave única para cada página baseada no caminho da URL
    const pageKey = encodeURIComponent(window.location.pathname.replace(/\//g, '_'));
    
    fetch(`https://api.countapi.xyz/hit/${namespace}/${pageKey}`)
      .then(res => res.json())
      .then(data => {
        const viewEl = document.getElementById('page-views');
        if (viewEl) viewEl.innerText = data.value;
      })
      .catch(() => {
        const viewEl = document.getElementById('page-views');
        if (viewEl) viewEl.innerText = '1';
      });
  })();
</script>
