---
layout: default
---

<article class="post-single">
  <header class="post-header">
    <div class="post-meta">
      <time>{{ page.date | date: "%d de %b de %Y" }}</time>
      <span class="meta-sep">·</span>
      <span class="post-author">{{ page.author | default: site.author }}</span>
    </div>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <!-- Botões de Compartilhamento com Ícones -->
  <section class="share-section">
    <span class="share-title">Compartilhar:</span>
    <div class="share-buttons">
      <!-- WhatsApp -->
      <a href="https://api.whatsapp.com/send?text={{ page.title | url_encode }}%20{{ site.url }}{{ site.baseurl }}{{ page.url }}" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="share-btn share-wa" 
         title="Compartilhar no WhatsApp">
        <svg class="share-icon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
        <span>WhatsApp</span>
      </a>

      <!-- E-mail -->
      <a href="mailto:?subject={{ page.title | url_encode }}&body=Confira%20este%20artigo:%20{{ site.url }}{{ site.baseurl }}{{ page.url }}" 
         class="share-btn share-mail" 
         title="Compartilhar via E-mail">
        <svg class="share-icon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
        <span>E-mail</span>
      </a>

      <!-- Instagram -->
      <a href="https://instagram.com" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="share-btn share-ig" 
         title="Instagram">
        <svg class="share-icon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
        <span>Instagram</span>
      </a>
    </div>
  </section>

  <div class="post-back">
    <a href="{{ '/' | relative_url }}">&larr; Voltar para as notas</a>
  </div>
</article>
