<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      } else if (systemPrefersDark) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <!-- Google Fonts: Courier Prime + Lora -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
</head>
<body>
  <div class="wrapper">
    <header class="header">
      <div class="header-main">
        <h1 class="logo">
          <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
        </h1>
        <button id="theme-btn" class="theme-btn" aria-label="Alternar tema" type="button">🌓</button>
      </div>

      <nav class="nav">
        <a href="{{ '/' | relative_url }}">Início</a>
        <a href="{{ '/sobre' | relative_url }}">Sobre</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
      <hr class="sep">
    </header>

    <main class="content">
      {{ content }}
    </main>

    <footer class="footer">
      <hr class="sep">
      <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author | default: site.title }} · Publicado com Jekyll</p>
    </footer>
  </div>

  <script>
    const themeBtn = document.getElementById('theme-btn');
    themeBtn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const nextTheme = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', nextTheme);
      localStorage.setItem('theme', nextTheme);
    });
  </script>
</body>
</html>
