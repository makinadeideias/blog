

<div class="notes-container">
  <h2>Recent notes</h2>
  <ul class="notes-list">
    {% for post in site.posts %}
      <li>
        <time datetime="{{ post.date | date_to_xmlschema }}" class="note-date">
          {{ post.date | date: "%d %b %Y" }}
        </time>
        <a href="{{ post.url | relative_url }}" class="note-title">
          {{ post.title }}
        </a>
      </li>
    {% endfor %}
  </ul>
</div>
