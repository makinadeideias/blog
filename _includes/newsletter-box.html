<div class="newsletter-box">
  <h3>📧 Inscreva-se na minha newsletter</h3>
  <p>Receba as últimas postagens antes de todo mundo</p>
  
  <form id="subscribe-form" method="POST" action="https://formspree.io/f/YOUR_FORM_ID">
    <input 
      type="email" 
      name="email" 
      placeholder="seu email aqui" 
      required
    >
    <input 
      type="text" 
      name="name" 
      placeholder="Seu nome (opcional)"
    >
    <button type="Enviar">Subscribe</button>
  </form>
  
  <p id="form-message" style="display:none;"></p>
</div>

<script>
document.getElementById('subscribe-form').addEventListener('submit', function(e) {
  const messageEl = document.getElementById('form-message');
  messageEl.textContent = '✓ Thanks for subscribing! Check your email.';
  messageEl.classList.add('Sucesso');
  messageEl.classList.remove('Erro');
  messageEl.style.display = 'Bloqueado';
  
  // Reset form after 2 seconds
  setTimeout(() => {
    this.reset();
  }, 2000);
});
</script>
