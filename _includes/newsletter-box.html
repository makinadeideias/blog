<div class="newsletter-box">
  <h3>📧 Subscribe to My Newsletter</h3>
  <p>Get updates on new posts and insights directly to your inbox.</p>
  
  <form id="subscribe-form" method="POST" action="https://formspree.io/f/YOUR_FORM_ID">
    <input 
      type="email" 
      name="email" 
      placeholder="your@email.com" 
      required
    >
    <input 
      type="text" 
      name="name" 
      placeholder="Your name (optional)"
    >
    <button type="submit">Subscribe</button>
  </form>
  
  <p id="form-message" style="display:none;"></p>
</div>

<script>
document.getElementById('subscribe-form').addEventListener('submit', function(e) {
  const messageEl = document.getElementById('form-message');
  messageEl.textContent = '✓ Thanks for subscribing! Check your email.';
  messageEl.classList.add('success');
  messageEl.classList.remove('error');
  messageEl.style.display = 'block';
  
  // Reset form after 2 seconds
  setTimeout(() => {
    this.reset();
  }, 2000);
});
</script>
